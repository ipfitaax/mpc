---
# cPanel Git Version Control deployment.
#
# cPanel clones this repository to ~/repositories/mpc, OUTSIDE the web root, and
# runs the tasks below when you press "Update from Remote" then "Deploy HEAD
# Commit". That indirection is the whole point: cloning straight into
# public_html would put .git/ inside the document root, and a readable .git is
# the entire source history — every commit, every path, every credential ever
# committed by mistake — handed to anyone who guesses the URL. Copying out of a
# clone that lives above the web root cannot leak that, whatever Apache does.
#
# The repo IS the deployment (README), so there is no build step here. These are
# copies, nothing more.
#
# WHY EACH PATH IS COPIED WITH `/.` AND INTO AN EXPLICIT TARGET:
# `cp -a api $DEPLOYPATH` does the right thing exactly once. On the second
# deploy $DEPLOYPATH/api already exists, so cp nests the source INSIDE it and
# you get public_html/api/api/enquiry.php while the real endpoint quietly keeps
# serving the old code. `cp -a api/. $DEPLOYPATH/api/` merges into the target
# every time, first deploy and hundredth.
#
# WHAT IS DELIBERATELY NOT HERE:
# - tests/, phpunit.xml, composer.json, composer.lock, vendor/ — dev only, and
#   README is explicit that vendor/ must never reach the host.
# - CLAUDE.md, README.md, TODOS.md, .gitattributes, .gitignore — notes to us.
# - storage/*.jsonl — real students' names and phone numbers. They live on the
#   server and are gitignored; nothing here writes over them.
# - admin/, lib/, bin/, database/ — the office ledger. See the block at the
#   bottom; it is commented out on purpose, not forgotten.
# NO ABSOLUTE PATHS TO COREUTILS. `cp`, not `/bin/cp`.
#
# Every copy task below used to be spelled /bin/cp. They are bare now because a
# bare name is right on every host and an absolute one is right only on hosts
# laid out as assumed — and this file has already been burned twice by assuming
# a path it could not see.
#
# HONESTY ABOUT WHY THIS CHANGED, because the commit that did it claims more
# than it could prove. It was made on the strength of a reported
#
#     /bin/cp: No such file or directory
#
# which would have been decisive: cPanel stops at the first failing task, so a
# missing cp would take the whole deploy with it and explain every silent
# no-op at once. But that output cannot have come from this account — Git
# Version Control had no repository configured at the time, so no deploy had
# ever run to produce it. So /bin/cp may never have been missing at all, and
# the real cause of those no-ops was almost certainly the DEPLOYPATH below.
#
# The change stays anyway, on its own merit rather than that story: these tasks
# run in a shell — which is why `export DEPLOYPATH` on the first line reaches
# the last — and a shell finds its own coreutils anywhere. There is a genuine
# data point nearby, too: the note further down records a deploy that died on
# "/bin/sh: bad interpreter: no such file", so /bin on this host is at least
# not certainly the standard symlink.
#
# What is worth keeping is the lesson rather than the diagnosis: a fix built on
# one unverified line of output looks exactly like a fix built on evidence, and
# both of them get committed with the same confidence.
deployment:
  tasks:
    # $HOME/public_html. READ OFF cPanel → Domains → Document Root for mpc.so,
    # not inferred, not assumed: /home/mpcso/public_html.
    #
    # This line has been wrong twice and neither miss was visible from outside.
    # It started as $HOME/public_html, was "fixed" to $HOME/public_html/mpc.so
    # on the strength of a guess about addon-domain layout, and the guess was
    # backwards — the original value had been right all along. The second miss
    # then got blamed for deploys that were failing for an unrelated reason,
    # which is how a correct line came to be changed into a wrong one.
    #
    # It was also briefly replaced by a three-step resolver that asked cPanel's
    # userdata, then searched $HOME for the directory containing office/. That
    # is gone. It existed only because nobody had looked the value up, and a
    # lookup that can return a plausible wrong answer is worse than a constant
    # that is checked — it would have found ~/public_html/mpc.so, a directory
    # left behind by the earlier broken deploys, and passed the guard with it.
    #
    # The rule this leaves: if mpc.so ever moves, read the new value off the
    # Domains screen and change this line. Do not derive it.
    - export DEPLOYPATH=$HOME/public_html

    # No colon-space in this string, deliberately. These tasks are YAML plain
    # scalars, and `- echo "mpc deploy: X"` parses as a MAPPING whose key is
    # `echo "mpc deploy` — cPanel then runs something that is not this command,
    # or rejects the file outright. Cheap to avoid, invisible when it bites.
    - echo "mpc deploy DEPLOYPATH=$DEPLOYPATH"

    # THE GUARD. cPanel stops on the first task that fails, so a bare `test -d`
    # ends the deploy visibly when the target is not there — rather than every
    # cp below "succeeding" into a directory cp had just created out of thin
    # air, which is what produced two clean green deploys that moved nothing.
    #
    # Note what this cannot catch: a directory that exists and is not the one
    # Apache serves. Nothing running inside the host can catch that, which is
    # exactly the case that cost the most time here. Only fetching a file over
    # HTTP can, which is why build.txt is stamped last and why the health check
    # in CLAUDE.md compares it against HEAD.
    - test -d "$DEPLOYPATH"

    # The marketing site and the sub-pages. Every .html file is a whole page:
    # they are client-rendered dc templates with their content inlined, so one
    # missing file is one missing page, not a broken include.
    - cp -a index.html $DEPLOYPATH/
    - cp -a course-basic-ai.html $DEPLOYPATH/
    - cp -a course-basic-computers.html $DEPLOYPATH/
    - cp -a course-basic-python.html $DEPLOYPATH/
    - cp -a course-computer-networking.html $DEPLOYPATH/
    - cp -a course-cybersecurity.html $DEPLOYPATH/
    - cp -a course-data-analysis.html $DEPLOYPATH/
    - cp -a course-database-management.html $DEPLOYPATH/
    - cp -a course-web-design.html $DEPLOYPATH/
    - cp -a mpc-login.html $DEPLOYPATH/
    - cp -a mpc-register.html $DEPLOYPATH/
    - cp -a mpc-forgot-password.html $DEPLOYPATH/

    # All three .js files are required and a missing one fails QUIETLY, which is
    # why they are listed one by one rather than as a glob: support.js absent is
    # a blank page, api-form.js absent leaves the enquiry button stuck on
    # "Sending…" while the page still looks alive. A glob that silently matches
    # two of three would reproduce exactly the bug README warns about.
    - cp -a support.js $DEPLOYPATH/
    - cp -a image-slot.js $DEPLOYPATH/
    - cp -a api-form.js $DEPLOYPATH/

    # The signed-in student page. It is PHP rather than one of the .html pages
    # above because it renders from the server's own session, which the dc
    # runtime cannot see. Without this file a successful Google sign-in lands
    # on a 404 — the flow works and looks broken.
    - cp -a account.php $DEPLOYPATH/

    # The student side of the quiz module. Same reason as account.php: these
    # render from the server's session and the dc runtime cannot see one.
    #
    # A WARNING ABOUT DEPLOYING THESE WITHOUT admin/. Nothing on the host can
    # CREATE a quiz while the office tool is left out of this file (see the
    # block at the bottom), so on a host without admin/ these two pages are
    # correct and permanently empty: every student sees "Nothing to sit yet".
    # That is honest rather than broken, and it is not useful. Deploy admin/ in
    # the same change if the intention is for anyone to actually sit a paper —
    # and read the block at the bottom first, because admin/ carries no deny
    # rule and needs mpc-config.php above public_html or it throws a fatal
    # error at a visitor.
    - cp -a quizzes.php $DEPLOYPATH/
    - cp -a quiz.php $DEPLOYPATH/

    # verify.php and the rewrite that makes mpc.so/verify work. The receipt slip
    # is printed with that URL on it, so the .htaccess is not optional cosmetics
    # — without it every printed receipt points at a 404.
    - cp -a verify.php $DEPLOYPATH/
    - cp -a .htaccess $DEPLOYPATH/

    # lib/ is already live and verify.php requires lib/db.php and lib/ledger.php
    # at load, so it deploys with the public site rather than with the office:
    # shipping verify.php without its library is a 500 on a URL printed on paper
    # receipts.
    - mkdir -p $DEPLOYPATH/assets $DEPLOYPATH/uploads $DEPLOYPATH/api $DEPLOYPATH/storage $DEPLOYPATH/lib
    - cp -a lib/. $DEPLOYPATH/lib/

    # Belt and braces on the local development database password.
    # config.local.php is gitignored, so cPanel's clone will not contain it and
    # this line will normally find nothing to delete. It is here because `cp -a
    # lib/.` copies whatever is in lib/, and running these same tasks from a
    # working tree rather than a clean clone DOES carry the file across — that
    # is not theory, it happened on the first dry run of this file. Production
    # keeps its credentials in mpc-config.php ABOVE public_html, so a
    # config.local.php inside the web root is always wrong and always safe to
    # remove.
    - rm -f $DEPLOYPATH/lib/config.local.php
    - cp -a assets/. $DEPLOYPATH/assets/
    - cp -a uploads/. $DEPLOYPATH/uploads/
    - cp -a api/. $DEPLOYPATH/api/

    # ---------------------------------------------------------------------
    # The office tool. Deployed as of this commit; it was left out until now.
    #
    # WHAT MADE IT SAFE TO SHIP, checked rather than assumed. admin/ needs
    # mpc-config.php sitting ALONGSIDE public_html, and without it every screen
    # throws a fatal error at whoever opens it. That file is confirmed present:
    #     curl 'https://mpc.so/verify?c=AAAAAAAAAAAA'
    # answers "No receipt matches that code", and it can only produce that
    # sentence by connecting to the database and running a query. A host with no
    # config could not answer it at all.
    #
    # If that check ever stops answering, this task is the first thing to
    # comment out again: admin/ is the one directory here with no deny rule,
    # because it is meant to be reachable, so a broken config is visible to the
    # public rather than hidden behind a 403.
    #
    # THE DATABASE IS A SEPARATE DEPLOYMENT AND IT IS NOT AUTOMATED. Files
    # arrive here; tables do not. The quiz screens need
    # database/migrations/004-assessment.sql run by hand, GRANTs included, and
    # nothing in this file can do that. They handle the gap themselves rather
    # than crashing — mpc_quiz_tables_present() in lib/quiz.php names the
    # migration on the office screens and tells students it is not switched on
    # yet — so deploying before migrating is untidy, not an outage.
    # INTO office/admin, not admin/. mpc-login.html sends staff to
    # `./office/admin/login.php`, and mpc.so/office/admin/login.php answers 200
    # today, so office/ is where the office tool actually lives on this host —
    # put there by hand, before this file was ever asked to deploy it.
    #
    # Copying to $DEPLOYPATH/admin instead would not move that installation an
    # inch. It would stand up a SECOND admin tree at /admin/, leave the one
    # staff actually open stale, and hand this repo two copies to keep in step
    # with no way to tell from the outside which one someone is logged into.
    # The link in the login page is the spec; this follows it.
    - mkdir -p $DEPLOYPATH/office/admin
    - cp -a admin/. $DEPLOYPATH/office/admin/

    # ONLY the deny rule, never the .jsonl files beside it. Enquiries written on
    # the server are the live copy; the repo has no business overwriting them.
    # The rule is re-copied every deploy because the day it goes missing is the
    # day storage/enquiries.jsonl is served to anyone who asks for it.
    - cp -a storage/.htaccess $DEPLOYPATH/storage/

    # The deploy stamp. Deploying here is two manual clicks in cPanel and there
    # is no CLI, so "is mpc.so actually running the commit I pushed?" otherwise
    # needs a browser login to read the SHA off the Manage screen. The health
    # check cannot answer it: every file it probes returns 200 on the previous
    # commit too. This writes the deployed SHA where curl can read it.
    #
    # LAST ON PURPOSE. cPanel stops on the first task that fails, so a stamp
    # written here can only appear after every copy above has run. Stamping
    # first would advertise a commit whose files never landed.
    #
    # NO `/bin/sh -c` WRAPPER HERE. The first version of this wrapped the whole
    # thing in one, and the deploy died with "/bin/sh: bad interpreter: no such
    # file" — on this host that interpreter is not there to spawn. Note what
    # that cost: the wrapper existed to carry an `exit 0` that would keep a
    # failed stamp from failing the deploy, and because the wrapper was itself
    # what failed, the guard never ran. A safety net that lives inside the
    # thing it protects is not a safety net. These tasks already run in a
    # shell — that is why `export DEPLOYPATH` on the first line reaches this
    # one — so plain `||` chains do the same job with nothing to spawn.
    #
    # cPanel ships git at /usr/local/cpanel/3rdparty/bin/git on some hosts and
    # /usr/bin/git on others, hence the fallback rather than one hardcoded
    # path. Each link ends in a write, so the file is always created: on total
    # failure it says "unknown", which is a stamp reporting that it does not
    # know rather than a stale SHA from the last deploy quietly left in place.
    - /usr/local/cpanel/3rdparty/bin/git rev-parse HEAD > $DEPLOYPATH/build.txt 2>/dev/null || git rev-parse HEAD > $DEPLOYPATH/build.txt 2>/dev/null || echo unknown > $DEPLOYPATH/build.txt
    - date -u +%Y-%m-%dT%H:%M:%SZ >> $DEPLOYPATH/build.txt || true

    # ---------------------------------------------------------------------
    # bin/ and database/ — still left out, and now deliberately never coming.
    #
    # admin/ moved up into the tasks above. These two did NOT follow it, and
    # that is a change of mind rather than an oversight: the earlier version of
    # this block listed all three together, to be uncommented in one go.
    #
    # THE REASON IS THAT THEY ARE ALREADY ON THE HOST. cPanel clones this repo
    # to ~/repositories/mpc, outside the web root, and the deploy copies FROM
    # there. So bin/adduser.php and database/migrations/*.sql are sitting on the
    # server already — every CLI job that needs them can be run from the clone,
    # and copying them into public_html would put a database dumper and the
    # whole schema inside the web root to gain precisely nothing.
    #
    # They rely on a deny rule if they go in; they rely on nothing at all if
    # they stay out. That is the better of the two.
    #
    # RUNNING THEM FROM THE CLONE takes one environment variable. The config
    # lookup in lib/db.php resolves `dirname(__DIR__, 2) . '/mpc-config.php'`,
    # which from public_html/lib finds ~/mpc-config.php and from
    # ~/repositories/mpc/lib looks for ~/repositories/mpc-config.php and finds
    # nothing. MPC_CONFIG overrides it:
    #
    #   cd ~/repositories/mpc
    #   export MPC_CONFIG=~/mpc-config.php
    #   php bin/selftest.php
    #   php bin/adduser.php --email=you@mpc.so --name="Your Name" --role=admin
    #   mysql -u USER -p DBNAME < database/migrations/004-assessment.sql
    #
    # Note MPC_CONFIG is read with getenv() and can only be set by whoever runs
    # the process — a web request cannot set it. That is why it is safe as an
    # override and would not be as a query parameter.
    #
    # bin/backup.php is the one with a deadline attached: README step 7 wants it
    # on a nightly cPanel cron. Point the cron at the clone, with the same
    # variable, and it never needs to be web-reachable:
    #
    #   MPC_CONFIG=/home/USER/mpc-config.php /usr/local/bin/php \
    #     /home/USER/repositories/mpc/bin/backup.php
    #
    # ON READING THE HOST, which cost a wrong conclusion once: /lib/, /bin/ and
    # /database/ all return 404 while /storage/ returns 403 from a byte-identical
    # deny rule, so 404-vs-403 does not distinguish "denied" from "missing" here.
    # Do not conclude a directory is absent from its status code — check over SSH
    # or in File Manager. lib/ IS on the host and always was.
    # ---------------------------------------------------------------------
