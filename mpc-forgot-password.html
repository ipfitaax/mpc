<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0}
a{color:#24A68A}
a:hover{color:#1C8570}
</style>
</helmet>

<div style="font-family:'Saira',-apple-system,BlinkMacSystemFont,sans-serif;color:#646965;background:#fafafa;min-height:100vh;display:flex;flex-direction:column">

  <header style="background:#fff;border-bottom:1px solid #e2e5e4">
    <div style="max-width:1140px;margin:0 auto;padding:0 24px;display:flex;align-items:center;min-height:76px">
      <a href="./MPC%20Landing%20Page.dc.html" style="display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit">
        <span style="width:44px;height:44px;background:#24A68A;color:#fff;font-weight:800;font-size:.8rem;display:flex;align-items:center;justify-content:center;border-radius:6px;letter-spacing:.03em">MPC</span>
        <span style="font-weight:800;color:#1d1f20;font-size:1rem;line-height:1.3">Mogadishu Professional Certificate<span style="display:block;font-size:.7rem;font-weight:600;color:#24A68A;letter-spacing:.04em">Learn by Doing It</span></span>
      </a>
    </div>
  </header>

  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:56px 24px">
    <div style="width:100%;max-width:420px;background:#fff;border:1px solid #e2e5e4;border-radius:6px;padding:36px">
      <span style="display:inline-block;font-size:.76rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#24A68A;border-left:3px solid #24A68A;padding-left:10px;margin-bottom:14px">Reset Password</span>
      <h1 style="font-size:1.6rem;font-weight:800;color:#1d1f20;margin:0 0 6px;letter-spacing:-.01em">Forgot your password?</h1>
      <p style="font-size:.94rem;margin:0 0 26px">Enter the email address linked to your account and we'll send you a reset link.</p>

      <form onsubmit="event.preventDefault();this.querySelector('.form-msg').style.display='block';">
        <div style="margin-bottom:22px">
          <label style="display:block;font-size:.85rem;font-weight:700;color:#1d1f20;margin-bottom:6px">Email address</label>
          <input type="email" required style="width:100%;padding:12px 14px;border:1px solid #e2e5e4;border-radius:6px;font-size:.95rem;color:#646965;background:#fff">
        </div>
        <button type="submit" style="width:100%;display:inline-block;padding:13px 26px;border-radius:6px;font-weight:700;font-size:.95rem;background:#24A68A;color:#fff;border:2px solid #24A68A;cursor:pointer" style-hover="background:#1C8570;border-color:#1C8570">Send Reset Link</button>
        <p class="form-msg" style="margin-top:14px;font-size:.9rem;font-weight:600;color:#24A68A;display:none">This is a design preview — no email will actually be sent.</p>
      </form>

      <div style="border-top:1px solid #e2e5e4;margin-top:26px;padding-top:20px;text-align:center;font-size:.9rem">
        <a href="./mpc-login.dc.html" style="font-weight:700;text-decoration:none">Back to log in</a>
      </div>
    </div>
  </div>
</div>

</x-dc>
</body>
</html>
